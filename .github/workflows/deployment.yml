
on: 
  push:
    branches: [main]
  # This tool encourages you to run it on pull requests to test the deployment process.
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # so we can push to npm without token. 
      contents: write # If your deploy script that you write needs to push a git commit, git tag, or create a GitHub Release.
      pull-requests: write # If you enable pull request comments (they are enabled by default).
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version-file: '.nvmrc'
        registry-url: 'https://registry.npmjs.org' # required to run npm publish. 

    # add deno because it's used to run deployment scripts.
    - uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    # install latest npm to make sure it works with OIDC publishing. 
    - run: npm install -g npm@latest
    - run: npm ci
    - run: npm run compile 
      
    - uses: levibostian/decaf@0.3.2
      env:
        # required to use 'gh' CLI in my step scripts. 
        GH_TOKEN: ${{ github.token }}
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        get_latest_release_current_branch: deno run --allow-all --quiet jsr:@levibostian/decaf-script-github-releases get 
        get_next_release_version: deno run --allow-all --quiet jsr:@levibostian/decaf-script-conventional-commits
        deploy: ./scripts/deployment-deploy.ts
        simulated_merge_type: rebase